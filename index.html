<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243782">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Barcellona 2026 – Sabato 19</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">BARCELLONA · 19–21 SETTEMBRE 2026</div>
      <h1>Sabato 19</h1>
      <div class="subtitle">Camp Nou → Passeig de Gràcia → centro → mare</div>
    </div>
    <button id="locateBtn" class="icon-btn" aria-label="Mostra la mia posizione" title="Dove sono">◎</button>
  </header>

  <nav class="tabs" aria-label="Vista">
    <button class="tab active" data-view="mapView">Mappa</button>
    <button class="tab" data-view="listView">Tappe</button>
  </nav>

  <main>
    <section id="mapView" class="view active">
      <div id="map"></div>
      <div class="map-note">I marker indicano le tappe reali. Per la navigazione usa “Portami qui”.</div>
    </section>

    <section id="listView" class="view">
      <div id="stopList" class="stop-list"></div>
    </section>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
  <aside id="detailSheet" class="detail-sheet" aria-hidden="true">
    <button id="closeSheet" class="close-btn" aria-label="Chiudi">×</button>
    <div id="sheetContent"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/tappe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
